[tool.partsmith]
# Settings for partsmith (github.com/georgesleen/kicad-partsmith). Commented
# settings show the defaults.

# KiCad path variables are <prefix>_SYMBOL_DIR, _FOOTPRINT_DIR, _3DMODEL_DIR,
# and _SPICE_MODEL_DIR.
library_prefix = "GS"
#
# symbol_dir = "symbols"
# footprint_dir = "footprints"
# model_dir = "3d-models"
# spice_model_dir = "spice-models"

# Symbol field names that the importer writes and the validator checks.
# [tool.partsmith.fields]
# manufacturer = "Manufacturer"
# mpn = "MPN"
# lcsc_id = "LCSC ID"
# package = "Package"
# validation_override = "Field Validation Override"
# spice_warning_override = "SPICE Warning Override"

# Library descriptions for KiCad's library tables, by name without the prefix.
# Other libraries get a description built from their name, with words from
# [description_words] (for example THT = "through-hole") replacing tokens.
[tool.partsmith.library_descriptions]
Diodes = "discrete diodes and rectifiers"

# Part family formats. Each family has its own variables (for example
# usb_c_socket has capability_short, capability, contacts, and mounting); every
# family also has mpn, manufacturer, lcsc_id, package, and name_package. A
# table replaces only the keys it sets.
# [tool.partsmith.families.usb_c_socket]
# name = "USB_C_Socket_{capability_short}"
# value = "USB_C_Socket_{capability_short}"
# description = ["USB Type-C receptacle", "{capability}", "{contacts} contacts", "{mounting}"]
# reference = "J"
